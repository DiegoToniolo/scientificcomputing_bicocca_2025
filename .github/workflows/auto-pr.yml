name: Auto PR on Push

on:
  push:
    branches:
      [devel]

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for proper branch comparison

      - name: Create Pull Request
        run: gh pr create --base main --head devel --title 'Merge devel into main' --body 'Created by Github action'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  auto-merge:
    needs: create-pull-request
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --base main --head devel --state open --json number --jq '.[0].number')
          gh pr merge $PR_NUMBER --squash --auto